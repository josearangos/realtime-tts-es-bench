<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<style>
:root{--paper:#f6f1e9;--ink:#2b211b;--signal:#c8360a;--serif:Georgia,"Times New Roman",serif;--mono:Menlo,monospace}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--paper)}
#root{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--paper);font-family:var(--serif)}
.scene{position:absolute;inset:0;overflow:hidden}
.shot{position:absolute;left:0;top:0;transform-origin:0 0;box-shadow:0 0 0 1px #d9cfc0}
.cap{position:absolute;left:0;right:0;bottom:84px;display:flex;justify-content:center}
.cap span{background:var(--ink);color:var(--paper);font-size:54px;line-height:1.15;padding:20px 40px;border-radius:6px;letter-spacing:-.01em}
.cap b{color:#ff8a5c;font-weight:700}
#end{background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px}
#end h1{font-size:150px;letter-spacing:-.03em;color:var(--ink);font-weight:700}
#end p{font-size:56px;color:var(--signal)}
#end small{font-family:var(--mono);font-size:30px;color:#6b5d52}
#rule{width:560px;height:6px;background:var(--ink)}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="23" data-width="1920" data-height="1080">

  <div id="s1" class="scene clip" data-start="0" data-duration="4.6" data-track-index="0">
    <img id="i_idle" class="shot" data-layout-allow-overflow src="assets/ui/h_idle.png" width="1920" height="1200" />
    <img id="i_typed" class="shot" data-layout-allow-overflow src="assets/ui/h_typed.png" width="1920" height="1200" />
  </div>
  <div id="s2" class="scene clip" data-start="4.4" data-duration="5.2" data-track-index="0">
    <img id="i_sel" class="shot" data-layout-allow-overflow src="assets/ui/h_selected.png" width="1920" height="1200" />
  </div>
  <div id="s3" class="scene clip" data-start="9.5" data-duration="5.7" data-track-index="0">
    <img id="i_play" class="shot" data-layout-allow-overflow src="assets/ui/h_playing.png" width="1920" height="1200" />
    <img id="i_full" class="shot" data-layout-allow-overflow src="assets/ui/h_full.png" width="1920" height="2480" />
  </div>
  <div id="s4" class="scene clip" data-start="15" data-duration="4.4" data-track-index="0">
    <img id="i_card" class="shot" data-layout-allow-overflow src="assets/ui/h_full.png" width="1920" height="2480" />
  </div>
  <div id="end" class="scene clip" data-start="19.2" data-duration="3.8" data-track-index="0">
    <h1 id="e1">Real-time TTS tester</h1><div id="rule"></div>
    <p id="e2">Pruébalo tú.</p>
    <small id="e3">phonon · valentina-phonon — es-CO</small>
  </div>

  <div id="c1" class="cap clip" data-start="0.7" data-duration="3.8" data-track-index="2"><span>Escribe una frase en español</span></div>
  <div id="c2" class="cap clip" data-start="4.7" data-duration="4.8" data-track-index="2"><span>Phonon · Piper · Pocket TTS</span></div>
  <div id="c3" class="cap clip" data-start="11.4" data-duration="3.7" data-track-index="2"><span>Primer audio en <b>31.89 ms</b> · <b>11.33×</b> tiempo real</span></div>
  <div id="c4" class="cap clip" data-start="15.3" data-duration="3.9" data-track-index="2"><span>valentina-phonon — <b>es-CO</b></span></div>

  <audio id="bed" data-start="0" data-duration="23" data-track-index="5" data-volume="0.13" src="assets/music/bed.mp3"></audio>
  <audio id="vo" data-start="0" data-duration="20.6" data-track-index="6" data-volume="1" src="assets/voiceover.wav"></audio>
  <audio id="sfx-click" data-start="9.52" data-duration="0.01" data-track-index="7" data-volume="0.6" src="assets/click.ogg"></audio>
  <audio id="sfx-hit" data-start="20.02" data-duration="0.18" data-track-index="8" data-volume="0.5" src="assets/hit.ogg"></audio>
</div>
<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
const K = 1920/1440;
// view(cx,cy,z): center the (cx,cy) point of the 1440-wide page at zoom z
const V = (cx,cy,z)=>({scale:K*z, x:960-cx*K*z, y:540-cy*K*z});
const set=(id,v,t)=>tl.set(id,{...v},t);
const mv=(id,v,d,t,e="power2.inOut")=>tl.to(id,{...v,duration:d,ease:e},t);
const fade=(id,a,b,d,t)=>tl.fromTo(id,{opacity:a},{opacity:b,duration:d,ease:"power2.out"},t);

// scene 1: idle -> typed
set("#i_idle",V(720,405,1),0); set("#i_typed",V(324,330,2.1),0);
fade("#i_typed",0,0,0.01,0);
mv("#i_idle",V(324,330,2.0),2.0,1.2);
tl.fromTo("#i_typed",{opacity:0},{opacity:1,duration:0.35},2.2);
mv("#i_typed",V(324,340,2.3),2.4,2.2,"sine.inOut");
fade("#s1",1,0,0.3,4.3);
// scene 2
set("#i_sel",V(324,430,1.7),4.4); fade("#s2",0,1,0.3,4.4);
mv("#i_sel",V(324,760,1.7),4.8,4.5,"sine.inOut");
fade("#s2",1,0,0.3,9.3);
// scene 3
set("#i_play",V(640,470,1.2),9.5); set("#i_full",V(900,400,1.6),9.5);
fade("#s3",0,1,0.3,9.5); fade("#i_full",0,0,0.01,9.5);
mv("#i_play",V(640,520,1.35),1.7,9.5,"sine.inOut");
tl.to("#i_full",{opacity:1,duration:0.4},11.2);
mv("#i_full",V(900,520,1.5),3.4,11.2,"sine.inOut");
fade("#s3",1,0,0.3,14.9);
// scene 4
set("#i_card",V(800,1380,1.55),15); fade("#s4",0,1,0.3,15);
mv("#i_card",V(800,1470,1.95),4,15.2,"sine.inOut");
// captions
["#c1","#c2","#c3","#c4"].forEach(id=>{
  const el=document.querySelector(id); const s=parseFloat(el.dataset.start), d=parseFloat(el.dataset.duration);
  tl.fromTo(id+" span",{opacity:0,y:20},{opacity:1,y:0,duration:0.35,ease:"power3.out"},s);
  tl.to(id+" span",{opacity:0,duration:0.25},s+d-0.3);
});
// end card
tl.fromTo("#end",{opacity:0},{opacity:1,duration:0.4},19.2);
tl.fromTo("#e1",{opacity:0,y:30},{opacity:1,y:0,duration:0.5,ease:"power3.out"},19.5);
tl.fromTo("#rule",{scaleX:0},{scaleX:1,duration:0.5,ease:"power3.out"},19.8);
tl.fromTo("#e2",{opacity:0,y:20},{opacity:1,y:0,duration:0.4,ease:"back.out(1.6)"},20.02);
tl.fromTo("#e3",{opacity:0},{opacity:1,duration:0.4},20.5);
window.__timelines["main"] = tl; tl.seek(0);
</script>
</body>
</html>
