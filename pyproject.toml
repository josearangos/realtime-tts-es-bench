[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tts-bench"
version = "0.1.0"
description = "Real-time Spanish TTS benchmark: engine adapters"
requires-python = ">=3.11"
dependencies = ["numpy"]

[project.optional-dependencies]
phonon = ["ptts"]
pocket = ["pocket-tts"]
piper = ["piper-tts"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["engine: needs a real TTS engine installed (run in that engine's venv)"]
